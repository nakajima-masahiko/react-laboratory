name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout react-laboratory
        uses: actions/checkout@v4

      - name: Checkout candle-core into vendor/
        uses: actions/checkout@v4
        with:
          repository: nakajima-masahiko/candle-core
          path: vendor/candle-core
          # Required while candle-core is private.
          # Create a fine-grained PAT with Contents: Read on candle-core only,
          # or a classic PAT with repo scope, then add repository secret:
          #   Name: CANDLE_CORE_READ_TOKEN
          token: ${{ secrets.CANDLE_CORE_READ_TOKEN }}

      - name: Ensure vendor package.json for source entry
        run: |
          cat > vendor/candle-core/package.json <<'EOF'
          {
            "name": "candle-core",
            "version": "0.2.0-beta-prep",
            "private": true,
            "type": "module",
            "main": "./src/index.ts",
            "module": "./src/index.ts",
            "types": "./src/index.ts",
            "exports": {
              ".": {
                "import": "./src/index.ts",
                "types": "./src/index.ts"
              }
            }
          }
          EOF
          test -f vendor/candle-core/src/index.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
