  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="700" fill="url(#sunGlow)"/>
  <circle cx="1150" cy="285" r="58" fill="#fff5c6" opacity=".86"/>

  <path d="M180 620 L720 105 L1280 620 Z" fill="url(#fuji)"/>
  <path d="M720 105 L586 235 L654 218 L706 268 L755 213 L806 246 L864 230 Z" fill="#fcfaf4" opacity=".96"/>
  <path d="M720 105 L586 235 L627 223 L688 178 L706 268 L755 213 L806 246 L864 230 Z" fill="#d8dfe0" opacity=".55"/>
  <path d="M0 590 C180 510 330 540 470 590 C630 646 795 575 930 550 C1100 518 1300 560 1600 505 L1600 700 L0 700 Z" fill="url(#farHills)"/>
  <path d="M0 635 C220 578 420 650 615 619 C825 586 1005 632 1190 600 C1360 570 1480 592 1600 575 L1600 718 L0 718 Z" fill="#385b55" opacity=".82"/>

  <rect y="650" width="1600" height="250" fill="url(#water)"/>
  <path d="M760 650 L1320 650 L1510 900 L615 900 Z" fill="url(#reflection)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M100 707 C360 689 475 716 700 701" stroke="#d6e1d7" stroke-width="5" opacity=".33"/>
    <path d="M850 730 C1070 711 1285 742 1490 716" stroke="#f6dfb8" stroke-width="6" opacity=".3"/>
    <path d="M240 780 C505 756 690 790 960 766" stroke="#d9ece2" stroke-width="4" opacity=".22"/>
    <path d="M920 830 C1130 806 1340 837 1535 817" stroke="#f7dfb3" stroke-width="5" opacity=".24"/>
    <path d="M25 858 C290 835 515 868 750 844" stroke="#d5e8df" stroke-width="4" opacity=".18"/>
  </g>

  <path d="M-80 620 C260 556 510 603 780 578 C1030 555 1285 592 1680 535 L1680 660 C1290 627 1038 657 770 632 C490 608 250 660-80 646 Z" fill="url(#mist)" opacity=".72"/>

  <use href="#pine" transform="translate(185 892) scale(1.25)"/>
  <use href="#pine" transform="translate(1455 870) scale(-1.08 1.08)"/>
  <path d="M0 815 C150 762 260 790 395 850 L395 900 L0 900 Z" fill="#162f2a"/>
  <path d="M1600 790 C1450 748 1352 788 1240 858 L1240 900 L1600 900 Z" fill="#18332e"/>

  <rect x="18" y="18" width="1564" height="864" rx="10" fill="none" stroke="#d8bd86" stroke-width="12" opacity=".8"/>
  <rect x="34" y="34" width="1532" height="832" rx="6" fill="none" stroke="#f7e8c8" stroke-width="3" opacity=".7"/>
</svg>
