<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">朝焼けの富士山と黒松</title>
  <desc id="desc">白の宿の浴場を飾る、朝焼けの富士山、湖、黒松を描いた銭湯絵風の壁画</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#668eaa"/>
      <stop offset=".42" stop-color="#d8b28f"/>
      <stop offset=".72" stop-color="#f2d2a7"/>
      <stop offset="1" stop-color="#d8c4a0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="72%" cy="35%" r="25%">
      <stop offset="0" stop-color="#fffbdc" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#ffd99e" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffd99e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fuji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f3e8"/>
      <stop offset=".27" stop-color="#e9e6df"/>
      <stop offset=".29" stop-color="#8197a3"/>
      <stop offset="1" stop-color="#415c65"/>
    </linearGradient>
    <linearGradient id="farHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#617b73"/>
      <stop offset="1" stop-color="#263f3b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db7af"/>
      <stop offset=".42" stop-color="#668d89"/>
      <stop offset="1" stop-color="#274a4b"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8d6a4" stop-opacity="0"/>
      <stop offset=".55" stop-color="#f8d6a4" stop-opacity=".16"/>
      <stop offset=".72" stop-color="#fff2c2" stop-opacity=".46"/>
      <stop offset="1" stop-color="#f8d6a4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4eee0" stop-opacity="0"/>
      <stop offset=".22" stop-color="#f4eee0" stop-opacity=".7"/>
      <stop offset=".65" stop-color="#f4eee0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f4eee0" stop-opacity="0"/>
    </linearGradient>
    <g id="pine">
      <path d="M0 0 C-12-86-8-182 10-282 C22-350 18-410 8-470" fill="none" stroke="#172c29" stroke-width="28" stroke-linecap="round"/>
      <path d="M4-170 C-48-224-104-246-174-250 M7-225 C72-280 134-302 210-294 M8-288 C-38-337-89-360-151-365 M11-348 C66-389 120-408 178-401 M9-405 C-18-435-47-449-84-454" fill="none" stroke="#1e3831" stroke-width="18" stroke-linecap="round"/>
      <g fill="#17352e">
        <ellipse cx="-176" cy="-251" rx="92" ry="23" transform="rotate(8 -176 -251)"/>
        <ellipse cx="-93" cy="-230" rx="82" ry="22" transform="rotate(17 -93 -230)"/>
        <ellipse cx="196" cy="-297" rx="106" ry="25" transform="rotate(-8 196 -297)"/>
        <ellipse cx="105" cy="-278" rx="89" ry="23" transform="rotate(-18 105 -278)"/>
        <ellipse cx="-148" cy="-366" rx="80" ry="21" transform="rotate(12 -148 -366)"/>
        <ellipse cx="-72" cy="-345" rx="70" ry="20" transform="rotate(20 -72 -345)"/>
        <ellipse cx="168" cy="-402" rx="88" ry="22" transform="rotate(-12 168 -402)"/>
        <ellipse cx="94" cy="-385" rx="72" ry="20" transform="rotate(-22 94 -385)"/>
        <ellipse cx="-80" cy="-454" rx="58" ry="18" transform="rotate(13 -80 -454)"/>
      </g>
    </g>
