      <stop offset=".42" stop-color="#668d89"/>
      <stop offset="1" stop-color="#274a4b"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8d6a4" stop-opacity="0"/>
      <stop offset=".55" stop-color="#f8d6a4" stop-opacity=".16"/>
      <stop offset=".72" stop-color="#fff2c2" stop-opacity=".46"/>
      <stop offset="1" stop-color="#f8d6a4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
