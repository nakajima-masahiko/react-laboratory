      <stop offset=".42" stop-color="#d8b28f"/>
      <stop offset=".72" stop-color="#f2d2a7"/>
      <stop offset="1" stop-color="#d8c4a0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="72%" cy="35%" r="25%">
      <stop offset="0" stop-color="#fffbdc" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#ffd99e" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffd99e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fuji" x1="0" y1="0" x2="0" y2="1">
