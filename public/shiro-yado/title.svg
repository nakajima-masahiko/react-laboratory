<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120" role="img" aria-label="Shiro no Yado — a quiet white inn">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf9f5"/>
      <stop offset="100%" stop-color="#efe8de"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0f4"/>
      <stop offset="100%" stop-color="#f2ebe3"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a635a"/>
      <stop offset="100%" stop-color="#4a453f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a574"/>
      <stop offset="100%" stop-color="#a8895c"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ebe3"/>
    </linearGradient>
  </defs>

  <!-- soft plaque -->
  <rect x="2" y="4" width="516" height="112" rx="10" fill="url(#panel)" stroke="#e4ddd3" stroke-width="1.5"/>
  <rect x="8" y="10" width="504" height="100" rx="7" fill="none" stroke="#d4cbc0" stroke-width="0.75" opacity="0.7"/>

  <!-- left: mini hotel vignette -->
  <g transform="translate(22,18)">
    <rect x="0" y="0" width="96" height="84" rx="6" fill="url(#sky)"/>
    <!-- ground -->
    <rect x="0" y="68" width="96" height="16" fill="#d9d0c4" opacity="0.85"/>
    <!-- building body -->
    <rect x="22" y="28" width="52" height="44" rx="1.5" fill="url(#wall)" stroke="#ddd5c8" stroke-width="0.8"/>
    <!-- roof -->
    <path d="M18 30 L48 14 L78 30 Z" fill="url(#roof)"/>
    <path d="M18 30 L48 14 L78 30 L78 34 L48 20 L18 34 Z" fill="#5a544c"/>
    <!-- wood floor lines -->
    <rect x="24" y="42" width="48" height="2.2" fill="url(#wood)" opacity="0.9"/>
    <rect x="24" y="54" width="48" height="2.2" fill="url(#wood)" opacity="0.9"/>
    <!-- windows -->
    <rect x="28" y="32" width="10" height="8" rx="0.8" fill="#c5d6de" stroke="#c4b8a8" stroke-width="0.6"/>
    <rect x="43" y="32" width="10" height="8" rx="0.8" fill="#c5d6de" stroke="#c4b8a8" stroke-width="0.6"/>
    <rect x="58" y="32" width="10" height="8" rx="0.8" fill="#c5d6de" stroke="#c4b8a8" stroke-width="0.6"/>
    <rect x="28" y="45" width="10" height="8" rx="0.8" fill="#c5d6de" stroke="#c4b8a8" stroke-width="0.6"/>
    <rect x="43" y="45" width="10" height="8" rx="0.8" fill="#c5d6de" stroke="#c4b8a8" stroke-width="0.6"/>
    <rect x="58" y="45" width="10" height="8" rx="0.8" fill="#c5d6de" stroke="#c4b8a8" stroke-width="0.6"/>
    <!-- door -->
    <rect x="42" y="58" width="12" height="14" rx="1" fill="#5c4a38"/>
    <rect x="38" y="56" width="20" height="3" rx="0.5" fill="url(#wood)"/>
    <!-- tiny trees -->
    <ellipse cx="14" cy="66" rx="6" ry="9" fill="#7d9478"/>
    <ellipse cx="82" cy="66" rx="5" ry="8" fill="#8aa584"/>
  </g>

  <!-- divider -->
  <line x1="132" y1="28" x2="132" y2="92" stroke="#d4cbc0" stroke-width="1"/>

  <!-- text block -->
  <g transform="translate(148,0)">
    <text x="0" y="42" font-family="Georgia, 'Times New Roman', 'Hiragino Mincho ProN', serif" font-size="15" fill="#938d84" letter-spacing="0.28em">A QUIET WHITE INN</text>
    <text x="0" y="72" font-family="Georgia, 'Times New Roman', 'Hiragino Mincho ProN', serif" font-size="28" font-weight="600" fill="#2c2a27" letter-spacing="0.04em">Shiro no Yado</text>
    <text x="0" y="96" font-family="'Hiragino Mincho ProN', 'Noto Serif JP', Georgia, serif" font-size="13" fill="#6f6a63" letter-spacing="0.35em">白 の 宿</text>
  </g>
</svg>
