<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-label="白の宿">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b6914"/>
      <stop offset="18%" stop-color="#a67c2a"/>
      <stop offset="35%" stop-color="#c4a35a"/>
      <stop offset="52%" stop-color="#b08940"/>
      <stop offset="70%" stop-color="#9a7530"/>
      <stop offset="88%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="woodEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c4010" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#5c4010" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3d2808" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0 0.08  0 0 0 0.18 0" in="noise" result="grainColor"/>
      <feBlend in="SourceGraphic" in2="grainColor" mode="multiply"/>
    </filter>
    <filter id="inkSoft">
      <feGaussianBlur stdDeviation="0.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="6" width="472" height="108" rx="6" ry="6" fill="url(#wood)" filter="url(#grain)"/>
  <rect x="4" y="6" width="472" height="108" rx="6" ry="6" fill="url(#woodEdge)"/>
  <rect x="10" y="12" width="460" height="96" rx="3" ry="3" fill="none" stroke="#5c4010" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="14" y="16" width="452" height="88" rx="2" ry="2" fill="none" stroke="#f5e6c8" stroke-opacity="0.22" stroke-width="1"/>

  <g stroke="#5c4010" stroke-opacity="0.12" stroke-width="0.8" fill="none">
    <path d="M20 28 Q120 26 240 30 T460 28"/>
    <path d="M18 48 Q140 52 280 46 T462 50"/>
    <path d="M22 72 Q160 68 300 74 T458 70"/>
    <path d="M20 95 Q180 98 320 92 T460 96"/>
  </g>

  <g filter="url(#inkSoft)" text-anchor="middle" dominant-baseline="central">
    <text x="240" y="58" font-family="Hiragino Mincho ProN, Noto Serif JP, Yu Mincho, serif" font-size="48" font-weight="600" fill="#1a1208" opacity="0.25" letter-spacing="0.12em">白の宿</text>
    <text x="240" y="56" font-family="Hiragino Mincho ProN, Noto Serif JP, Yu Mincho, serif" font-size="48" font-weight="600" fill="#1a1208" letter-spacing="0.12em">白の宿</text>
  </g>

  <g fill="none" stroke="#3d2808" stroke-opacity="0.4" stroke-width="1.2">
    <path d="M18 22 h12 M18 22 v12"/>
    <path d="M462 22 h-12 M462 22 v12"/>
    <path d="M18 98 h12 M18 98 v-12"/>
    <path d="M462 98 h-12 M462 98 v-12"/>
  </g>
</svg>
